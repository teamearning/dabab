<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nova Injector // Results Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <button class="launcher" id="sakura-trigger" aria-label="Open Nova Injector panel"><span class="launcher-ring launcher-ring--one"></span><span class="launcher-ring launcher-ring--two"></span><span class="launcher-core"><span></span></span><span class="launcher-label">N</span></button>

  <aside class="panel" id="sakura-hud" aria-label="Nova Injector results console">
    <div class="panel-noise"></div><div class="scanner-line"></div><canvas id="particle-canvas" aria-hidden="true"></canvas>
    <header class="panel-header"><div class="brand-lockup"><div class="brand-mark"><span></span><span></span><span></span></div><div><p class="eyebrow">NOVA / INJECTOR</p><h1 id="display-hud-title">RESULTS CONSOLE</h1></div></div><span class="status-pill"><i></i>ONLINE</span></header>
    <div class="panel-rule"><span></span></div>
    <section class="system-strip"><span><b class="live-dot"></b> SECURE NODE</span><span class="node-id">NX-<em>07</em></span></section>

    <section class="viewport" id="hologram-viewport">
      <div class="viewport-corner viewport-corner--tl"></div><div class="viewport-corner viewport-corner--br"></div><div class="scan-grid"></div><div class="radar"></div><div class="crosshair crosshair--x"></div><div class="crosshair crosshair--y"></div><div class="result-aura" id="fx-aura"></div>
      <div class="readout" id="readout-box"><div class="readout-kicker">SIGNAL OUTPUT</div><div class="readout-title" id="readout-main-txt">SYSTEM LOCKED</div><div class="readout-subtitle" id="readout-sub-txt">CLICK BUTTON TO PROCEED</div></div>
      <div class="core" id="fx-core"><div class="core-orbit core-orbit--outer"></div><div class="core-orbit core-orbit--inner"></div><div class="core-diamond"></div><div class="core-pulse"></div></div>
      <div class="viewport-meta"><span>LIVE FEED</span><span>30 SEC / WIN GO</span></div>
    </section>

    <section class="result-board" id="result-board" aria-live="polite">
      <div class="result-card result-card--period"><span class="card-label">PERIOD</span><strong id="period-value">WAITING</strong><small id="period-hint">NEXT ISSUE</small></div>
      <div class="result-card result-card--number"><span class="card-label">NUMBER</span><strong id="number-value">—</strong><small id="color-value">PENDING</small></div>
      <div class="result-card result-card--size"><span class="card-label">SIZE</span><strong id="size-value">—</strong><small>BIG / SMALL</small></div>
    </section>

    <section class="telemetry"><div class="telemetry-item"><span class="telemetry-label">LATENCY</span><strong id="ping-text">42ms</strong></div><div class="telemetry-item telemetry-item--accuracy"><span class="telemetry-label">CONFIDENCE</span><strong id="acc-text">0%</strong><div class="accuracy-track"><i id="acc-bar"></i></div></div></section>
    <section class="action-area"><button class="action action--primary" id="custom-btn-active">RUN SCAN <span>↗</span></button><button class="action action--quiet" id="custom-btn-hide">MINIMIZE</button></section>
    <footer class="panel-footer"><span>INJECTOR UI / V5.0</span><span id="footer-state">READY</span></footer>
  </aside>
  <script src="app.js"></script>
</body>
</html>
